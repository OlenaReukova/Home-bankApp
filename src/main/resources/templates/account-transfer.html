<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transfer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Transfer</h1>

    <form method="post" th:action="@{/dashboard/accounts/{id}/transfer(id=${accountId})}">
        <label>To Account Number</label>
        <input type="text" name="toAccountNumber" placeholder="ACC-XXXXXXXX" required/>

        <label>Amount</label>
        <input type="number" name="amount" min="0.01" step="0.01" required/>

        <button type="submit">Transfer</button>
    </form>

    <a th:href="@{/dashboard/accounts/{id}(id=${accountId})}">Cancel</a>
</div>
</body>
</html>
