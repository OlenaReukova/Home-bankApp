<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="container">
    <h1>Sign in</h1>

    <form method="post" th:action="@{/login}">

        <div th:if="${param.error}">
            <p class="error">Invalid email or password.</p>
        </div>

        <div th:if="${param.logout}">
            <p class="error">You have been logged out.</p>
        </div>

        <div th:if="${param.registered}">
            <p class="error">Registration successful. Please log in.</p>
        </div>

        <label>Email</label>
        <input type="email" name="username" placeholder="email@example.com" required/>

        <label>Password</label>
        <input type="password" name="password" placeholder="Password" required/>

        <button type="submit">Sign in</button>

    </form>

    <p style="margin-top: 24px; font-size: 14px; color: #555;">
        Don't have an account?
        <a th:href="@{/register}" style="color: #26314B; font-weight: 600;">Register</a>
    </p>
</div>
</body>
</html>
