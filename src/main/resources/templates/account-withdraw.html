<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Withdraw</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Withdraw</h1>

    <form method="post" th:action="@{/dashboard/accounts/{id}/withdraw(id=${accountId})}">
        <label>Amount</label>
        <input type="number" name="amount" min="0.01" step="0.01" required/>
        <button type="submit">Withdraw</button>
    </form>

    <a th:href="@{/dashboard/accounts/{id}(id=${accountId})}">Cancel</a>
</div>
</body>
</html>
