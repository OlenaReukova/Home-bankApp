<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="container">
    <h1>Hello, <span th:text="${firstName}">User</span>!</h1>

    <p style="color: #555; font-size: 16px;" th:text="${email}"></p>

    <form method="post" th:action="@{/logout}" style="margin-top: 40px;">
        <button type="submit">Logout</button>
    </form>
</div>
</body>
</html>
